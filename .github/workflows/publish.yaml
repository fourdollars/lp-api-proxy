name: Publish to CharmHub

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: "CharmHub channel to publish to"
        required: true
        default: "edge"
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable

jobs:
  publish:
    name: Build and Publish Charm
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Charmcraft
        run: sudo snap install charmcraft --classic

      - name: Pack charm
        run: charmcraft pack --destructive-mode

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: lp-api-proxy-charm
          path: "*.charm"
          retention-days: 30

      - name: Upload charm to CharmHub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_TOKEN }}
        run: |
          CHARM_FILE=$(ls *.charm | head -1)
          echo "Uploading $CHARM_FILE to CharmHub..."
          charmcraft upload "$CHARM_FILE" --name lp-api-proxy --format json > upload-result.json
          cat upload-result.json
          REVISION=$(jq -r '.revision' upload-result.json)
          echo "revision=$REVISION" >> "$GITHUB_ENV"
          echo "Uploaded as revision $REVISION"

      - name: Determine target channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            CHANNEL="edge"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-rc ]]; then
            CHANNEL="beta"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="candidate"
          else
            CHANNEL="edge"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Target channel: $CHANNEL"

      - name: Release to channel
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_TOKEN }}
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          charmcraft release lp-api-proxy \
            --revision="${{ env.revision }}" \
            --channel="$CHANNEL"

      - name: Get CharmHub status
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_TOKEN }}
        run: charmcraft status lp-api-proxy
